<div class="page-header">
  <div>
    <h1 class="page-header-title">الفواتير والمبيعات</h1>
    <p class="page-header-sub">إنشاء وإدارة فواتير الخدمات والمنتجات مع الخصم التلقائي للمخزون</p>
  </div>
  <div>
    <button class="btn btn-primary" id="btn-create-invoice">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:6px">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      إنشاء فاتورة جديدة
    </button>
  </div>
</div>

<!-- بطاقات الإحصائيات -->
<div class="invoices-stats-grid">
  <div class="stat-card">
    <div class="stat-icon-wrapper" style="background:rgba(212,175,55,0.15);color:var(--accent-gold)">
      🧾
    </div>
    <div class="stat-content">
      <div class="stat-label">إجمالي الفواتير</div>
      <div class="stat-value" id="stat-total-invoices">0</div>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-icon-wrapper" style="background:rgba(46,204,113,0.15);color:#2ecc71">
      💰
    </div>
    <div class="stat-content">
      <div class="stat-label">مجموع المبيعات</div>
      <div class="stat-value" id="stat-total-revenue">0.000 ر.ع</div>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-icon-wrapper" style="background:rgba(52,152,219,0.15);color:#3498db">
      📦
    </div>
    <div class="stat-content">
      <div class="stat-label">عناصر مبيعة</div>
      <div class="stat-value" id="stat-items-sold">0</div>
    </div>
  </div>
</div>

<!-- شريط البحث والفلترة -->
<div class="invoices-filter-bar">
  <div class="filter-group" style="flex:1;max-width:320px">
    <input type="text" id="invoice-search" class="input" placeholder="بحث برقم الفاتورة أو اسم العميل..." />
  </div>

  <div class="filter-group">
    <label>من</label>
    <input type="date" id="invoice-date-from" class="input" style="width:145px" />
  </div>

  <div class="filter-group">
    <label>إلى</label>
    <input type="date" id="invoice-date-to" class="input" style="width:145px" />
  </div>

  <button id="invoice-filter-clear" class="btn btn-ghost btn-sm">مسح الفلاتر</button>
  <span class="orders-results-count" id="invoices-count"></span>
</div>

<!-- جدول الفواتير -->
<div class="table-wrapper">
  <table class="data-table">
    <thead>
      <tr>
        <th>رقم الفاتورة</th>
        <th>اسم العميل</th>
        <th>تاريخ الإصدار</th>
        <th>عدد المواد</th>
        <th>المبلغ الإجمالي</th>
        <th style="text-align:center">الإجراءات</th>
      </tr>
    </thead>
    <tbody id="invoices-tbody">
      <tr>
        <td colspan="6" style="text-align:center;padding:3rem">
          <div class="spinner" style="margin:auto"></div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
